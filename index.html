<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附近吃什麼</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root {
  --accent: #f57c00;
  --accent-dark: #e65100;
  --blue: #1a73e8;
  --bg: #fafafa;
  --card: #fff;
  --text: #222;
  --muted: #777;
  --border: #e5e5e5;
}

* { box-sizing: border-box; margin: 0; }

body {
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 88px;
}

/* ---------- 頂部 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 1000;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--card); border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 1.15rem; flex-shrink: 0; }
.loc-status {
  flex: 1; min-width: 0;
  background: none; border: none; cursor: pointer;
  font-size: 0.8rem; color: var(--muted);
  text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.loc-status.error { color: #c62828; }

.btn {
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--text);
  padding: 7px 14px; font-size: 0.9rem; cursor: pointer;
  text-decoration: none; display: inline-block;
}
.btn:active { transform: scale(0.97); }
.btn-ghost { border-color: transparent; color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.retry { margin-left: 10px; padding: 3px 12px; font-size: 0.8rem; }

/* ---------- 篩選 ---------- */
.filters {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 12px;
}
.filter-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.filter-label { font-size: 0.85rem; color: var(--muted); padding-top: 6px; min-width: 2.5em; }

.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button {
  border: none; border-right: 1px solid var(--border);
  background: var(--card); padding: 7px 14px; font-size: 0.85rem; cursor: pointer;
}
.seg button:last-child { border-right: none; }
.seg button.active { background: var(--accent); color: #fff; }

.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.check { font-size: 0.85rem; display: flex; align-items: center; padding: 4px 0; cursor: pointer; }

select {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.85rem; background: var(--card); max-width: 200px;
}

.toggles { gap: 18px; }
.switch { font-size: 0.85rem; display: flex; align-items: center; gap: 4px; cursor: pointer; }

/* ---------- 地圖與清單 ---------- */
#map { height: 40vh; min-height: 260px; }

main { max-width: 1100px; margin: 0 auto; }

.list-info {
  padding: 10px 14px; font-size: 0.85rem; color: var(--muted);
  display: flex; align-items: center;
}

.list { list-style: none; padding: 0 10px; display: flex; flex-direction: column; gap: 8px; }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.card:active { background: #f5f5f5; }
.card-main { min-width: 0; flex: 1; }
.card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-title .name { font-weight: 600; font-size: 0.98rem; }
.badge {
  font-size: 0.68rem; background: #fff3e0; color: var(--accent-dark);
  border-radius: 20px; padding: 2px 8px; white-space: nowrap;
}
.card-sub { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
.open-open { color: #2e7d32; }
.open-closed { color: #c62828; }
.open-unknown { color: #bbb; }
.card-addr { font-size: 0.78rem; color: #999; margin-top: 3px; }

.card-actions { display: flex; gap: 2px; flex-shrink: 0; }
.icon-btn {
  border: none; background: none; cursor: pointer;
  font-size: 1.05rem; color: #bbb; padding: 6px 8px;
  text-decoration: none; line-height: 1;
}
.icon-btn.fav.on, .icon-btn.fav:active { color: #e91e63; }
.icon-btn:active { color: var(--text); }

/* ---------- 黑名單 ---------- */
.blacklist { margin: 14px 10px; font-size: 0.85rem; color: var(--muted); }
.blacklist summary { cursor: pointer; padding: 6px 4px; }
.bl-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 4px; border-bottom: 1px dashed var(--border);
}

/* ---------- 抽籤按鈕 ---------- */
.spin-btn {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  z-index: 1000; border: none; border-radius: 40px;
  background: var(--accent); color: #fff;
  font-size: 1.1rem; font-weight: 700;
  padding: 15px 42px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(245, 124, 0, 0.45);
}
.spin-btn:active { transform: translateX(-50%) scale(0.96); }
.spin-btn:disabled { background: #ccc; box-shadow: none; cursor: default; }

/* ---------- 拉霸 overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0, 0, 0, 0.65);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.slot-box {
  background: var(--card); border-radius: 20px;
  width: 100%; max-width: 420px; padding: 28px 24px;
  text-align: center; position: relative;
}
.slot-title { font-size: 0.9rem; color: var(--muted); }
.slot-name {
  font-size: 1.7rem; font-weight: 800; margin: 18px 0;
  min-height: 2.4em; display: flex; align-items: center; justify-content: center;
  word-break: break-all;
}
.slot-name.done { color: var(--accent-dark); animation: pop 0.35s ease; }
@keyframes pop {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.slot-result { margin-bottom: 14px; }
.res-sub { font-size: 0.9rem; color: var(--muted); }
.res-addr { font-size: 0.8rem; color: #999; margin-top: 4px; }
.slot-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.slot-actions .btn { padding: 11px; font-size: 0.95rem; }
.slot-close {
  position: absolute; top: 10px; right: 12px;
  border: none; background: none; font-size: 1.1rem; color: #aaa; cursor: pointer;
}

/* ---------- toast ---------- */
.toast {
  position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
  z-index: 3000; background: #333; color: #fff;
  font-size: 0.85rem; padding: 10px 18px; border-radius: 24px;
  max-width: 90vw; text-align: center;
}

.hidden { display: none !important; }

/* ---------- 桌面版面 ---------- */
@media (min-width: 860px) {
  body { padding-bottom: 0; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "list map" "bl map";
    gap: 0 14px; align-items: start;
  }
  #map { grid-area: map; height: calc(100vh - 130px); position: sticky; top: 57px; }
  .list-info { grid-area: list; }
  .list { grid-area: list; }
  .blacklist { grid-area: bl; }
}
</style>
</head>
<body>

<header class="topbar">
  <h1>附近吃什麼</h1>
  <button id="locStatus" class="loc-status" title="點擊重新定位">定位中…</button>
  <button id="filterToggle" class="btn btn-ghost">篩選 ▾</button>
</header>

<section id="filterPanel" class="filters hidden">
  <div class="filter-row">
    <span class="filter-label">距離</span>
    <div class="seg" id="radiusSeg">
      <button data-r="500">500m</button>
      <button data-r="1000">1km</button>
      <button data-r="2000">2km</button>
      <button data-r="3000">3km</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">類型</span>
    <div class="checks" id="catChecks"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">料理</span>
    <select id="cuisineSel"><option value="all">全部</option></select>
  </div>
  <div class="filter-row toggles">
    <label class="switch"><input type="checkbox" id="openNowChk"> 只看營業中</label>
    <label class="switch"><input type="checkbox" id="favOnlyChk"> 只看最愛</label>
  </div>
</section>

<main>
  <div id="map"></div>
  <div id="listInfo" class="list-info"></div>
  <ul id="restaurantList" class="list"></ul>
  <details id="blacklistBox" class="blacklist hidden">
    <summary id="blacklistSummary"></summary>
    <ul id="blacklistItems"></ul>
  </details>
</main>

<button id="spinBtn" class="spin-btn" disabled>幫我決定!</button>

<div id="slotOverlay" class="overlay hidden">
  <div class="slot-box">
    <div class="slot-title">今天吃…</div>
    <div id="slotName" class="slot-name">???</div>
    <div id="slotResult" class="slot-result hidden"></div>
    <div class="slot-actions hidden" id="slotActions">
      <a id="slotGmaps" class="btn" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>
      <button id="slotAgain" class="btn">再抽一次</button>
      <button id="slotDone" class="btn btn-primary">就這間!</button>
    </div>
    <button id="slotClose" class="slot-close" aria-label="關閉">✕</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opening_hours@3.14.0/build/opening_hours.js"></script>
<script>
/* 常數與工具:分類對照、cuisine 對照、Overpass 查詢、localStorage helpers */

const CATEGORY_DEFS = [
  { id: 'restaurant', label: '餐廳',       tags: { amenity: ['restaurant'] } },
  { id: 'fast_food',  label: '速食',       tags: { amenity: ['fast_food'] } },
  { id: 'cafe',       label: '咖啡廳/飲料', tags: { amenity: ['cafe'], shop: ['tea'] } },
  { id: 'food_court', label: '美食街',     tags: { amenity: ['food_court'] } },
  { id: 'bar',        label: '酒吧',       tags: { amenity: ['bar', 'pub'] } },
  { id: 'dessert',    label: '冰品/甜點',  tags: { amenity: ['ice_cream'], shop: ['bakery', 'confectionery', 'dessert'] } },
];

const CATEGORY_BY_ID = Object.fromEntries(CATEGORY_DEFS.map(c => [c.id, c]));

const CUISINE_ZH = {
  taiwanese: '台式', chinese: '中式', japanese: '日式', korean: '韓式',
  italian: '義式', american: '美式', thai: '泰式', vietnamese: '越式',
  indian: '印度', mexican: '墨西哥', ramen: '拉麵', sushi: '壽司',
  hot_pot: '火鍋', hotpot: '火鍋', barbecue: '燒烤', bbq: '燒烤',
  steak_house: '牛排', burger: '漢堡', pizza: '披薩', noodle: '麵食',
  noodles: '麵食', vegetarian: '素食', vegan: '純素', seafood: '海鮮',
  bubble_tea: '手搖飲', breakfast: '早餐', brunch: '早午餐', curry: '咖哩',
  coffee_shop: '咖啡', dessert: '甜點', cake: '蛋糕', sandwich: '三明治',
  dumplings: '餃子', bento: '便當', chicken: '雞肉料理', asian: '亞洲料理',
  french: '法式', german: '德式', spanish: '西班牙', greek: '希臘',
  turkish: '土耳其', kebab: '沙威瑪', ice_cream: '冰淇淋', tea: '茶飲',
  juice: '果汁', salad: '輕食', deli: '熟食', donuts: '甜甜圈',
  pastry: '糕點', regional: '地方料理', international: '異國料理',
};

function categoryOf(tags) {
  for (const def of CATEGORY_DEFS) {
    for (const [key, vals] of Object.entries(def.tags)) {
      if (tags[key] && vals.includes(tags[key])) return def.id;
    }
  }
  return null;
}

function cuisineLabel(raw) {
  if (!raw) return null;
  const first = raw.split(';')[0].trim();
  return CUISINE_ZH[first] || first;
}

function buildOverpassQuery(lat, lng, radius) {
  const amenities = [...new Set(CATEGORY_DEFS.flatMap(c => c.tags.amenity || []))].join('|');
  const shops = [...new Set(CATEGORY_DEFS.flatMap(c => c.tags.shop || []))].join('|');
  return `[out:json][timeout:25];
(
  nwr["amenity"~"^(${amenities})$"](around:${radius},${lat},${lng});
  nwr["shop"~"^(${shops})$"](around:${radius},${lat},${lng});
);
out center tags;`;
}

const LS = {
  FAVS: 'eat-favorites',
  BLACKLIST: 'eat-blacklist',
  RECENT: 'eat-recent-picks',
  FILTERS: 'eat-filters',
  SOURCE: 'eat-data-source',
};

const store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? JSON.parse(v) : fallback;
    } catch {
      return fallback;
    }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* ignore */ }
  },
};

function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371e3, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function formatDist(m) {
  return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
}
</script>
<script>
(function () {
  'use strict';

  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://lz4.overpass-api.de/api/interpreter',
    'https://z.overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
  ];
  const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
  const NOMINATIM_QUERIES = ['restaurant', 'fast food', 'cafe', 'tea'];
  const TYPE_TO_CAT = {
    restaurant: 'restaurant', fast_food: 'fast_food', cafe: 'cafe',
    food_court: 'food_court', bar: 'bar', pub: 'bar', ice_cream: 'dessert',
    bakery: 'dessert', confectionery: 'dessert', dessert: 'dessert', tea: 'cafe',
  };
  const DEFAULT_CENTER = [25.0478, 121.5319]; // 台北車站
  const RECENT_CAP = 10;

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  const state = {
    pos: null,
    restaurants: [],
    filters: {
      radius: 1000,
      cats: new Set(CATEGORY_DEFS.map(c => c.id)),
      cuisine: 'all',
      openNow: false,
      favOnly: false,
    },
    favs: new Set(store.get(LS.FAVS, [])),
    blacklist: new Map(store.get(LS.BLACKLIST, []).map(e => [e.id, e.name])),
    recent: store.get(LS.RECENT, []),
    manualPick: false,
    loading: false,
    degraded: false,
    lastWinner: null,
  };

  // 還原上次的篩選條件
  const saved = store.get(LS.FILTERS, null);
  if (saved) {
    if (saved.radius) state.filters.radius = saved.radius;
    if (Array.isArray(saved.cats)) state.filters.cats = new Set(saved.cats);
    if (saved.openNow) state.filters.openNow = true;
  }

  let map, userDot, radiusCircle, markerLayer;
  const markersById = new Map();

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg, ms = 3000) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), ms);
  }

  /* ---------- 地圖 ---------- */
  function initMap() {
    map = L.map('map').setView(DEFAULT_CENTER, 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
    map.on('click', (e) => {
      if (!state.manualPick) return;
      setPosition(e.latlng.lat, e.latlng.lng, '已使用手動選取的位置');
    });
  }

  function updateUserMarker() {
    if (userDot) { userDot.remove(); radiusCircle.remove(); }
    userDot = L.circleMarker(state.pos, {
      radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1,
    }).addTo(map);
    radiusCircle = L.circle(state.pos, {
      radius: state.filters.radius, color: '#1a73e8', weight: 1.5, fillOpacity: 0.05,
    }).addTo(map);
  }

  function renderMarkers(items) {
    markerLayer.clearLayers();
    markersById.clear();
    for (const r of items) {
      const m = L.circleMarker([r.lat, r.lng], {
        radius: 7, color: '#fff', weight: 2,
        fillColor: state.favs.has(r.id) ? '#e91e63' : '#f57c00', fillOpacity: 0.9,
      });
      const pop = el('div', 'popup');
      pop.appendChild(el('strong', null, r.name));
      pop.appendChild(el('div', 'popup-sub', `${r.catLabel}${r.cuisineLabel ? ' · ' + r.cuisineLabel : ''} · ${formatDist(r.distance)}`));
      const a = el('a', null, 'Google 地圖 ↗');
      a.href = r.gmaps; a.target = '_blank'; a.rel = 'noopener';
      pop.appendChild(a);
      m.bindPopup(pop);
      m.addTo(markerLayer);
      markersById.set(r.id, m);
    }
  }

  /* ---------- 定位 ---------- */
  function locate() {
    setLocStatus('定位中…', false);
    if (!navigator.geolocation) return geoFail('此瀏覽器不支援定位');
    navigator.geolocation.getCurrentPosition(
      (p) => setPosition(p.coords.latitude, p.coords.longitude),
      (err) => geoFail(err.code === 1 ? '定位被拒絕' : '定位失敗'),
      { timeout: 10000, maximumAge: 60000 }
    );
  }

  function geoFail(msg) {
    state.manualPick = true;
    setLocStatus(`${msg} — 點此重試,或直接點地圖選位置`, true);
    toast(msg + ',可點擊地圖手動選擇位置', 5000);
  }

  function setLocStatus(text, isError) {
    const s = $('locStatus');
    s.textContent = text;
    s.classList.toggle('error', !!isError);
  }

  function setPosition(lat, lng, note) {
    state.pos = { lat, lng };
    setLocStatus(`已定位 ${lat.toFixed(4)}, ${lng.toFixed(4)}${note ? ' · ' + note : ''}`, false);
    map.setView([lat, lng], 15);
    updateUserMarker();
    fetchRestaurants();
  }

  /* ---------- Overpass ---------- */
  // 平行 race 所有 endpoint,個別 timeout;任一成功即中止其餘
  function timedFetch(url, opts, ms, stopSignal) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    const onStop = () => ctrl.abort();
    if (stopSignal) stopSignal.addEventListener('abort', onStop);
    return fetch(url, { ...opts, signal: ctrl.signal })
      .then(async (res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .finally(() => {
        clearTimeout(timer);
        if (stopSignal) stopSignal.removeEventListener('abort', onStop);
      });
  }

  async function fetchRestaurants() {
    if (!state.pos || state.loading) return;
    state.loading = true;
    $('listInfo').textContent = '搜尋附近餐廳中…';
    // 記住可用的資料源:上次走備援且未滿一天 → 直接備援,不浪費時間等 Overpass 逾時
    const pref = store.get(LS.SOURCE, null);
    const useOverpass = !(pref && pref.name === 'nominatim' && Date.now() - pref.ts < 864e5);
    if (useOverpass) {
      const body = 'data=' + encodeURIComponent(
        buildOverpassQuery(state.pos.lat, state.pos.lng, state.filters.radius)
      );
      const opts = {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      };
      const stop = new AbortController();
      try {
        const data = await Promise.any(
          OVERPASS_ENDPOINTS.map(u => timedFetch(u, opts, 9000, stop.signal))
        );
        stop.abort();
        state.restaurants = normalizeAll(data.elements || []);
        state.degraded = false;
        state.loading = false;
        store.set(LS.SOURCE, { name: 'overpass', ts: Date.now() });
        updateCuisineOptions();
        renderAll();
        return;
      } catch { /* 全滅 → 備援 */ }
    }
    try {
      $('listInfo').textContent = '改用備援資料源查詢中…';
      const items = await fetchNominatim();
      state.restaurants = items;
      state.degraded = true;
      state.loading = false;
      store.set(LS.SOURCE, { name: 'nominatim', ts: Date.now() });
      updateCuisineOptions();
      renderAll();
      if (items.length) toast('Overpass 連線失敗,改用備援資料(資訊可能較不完整)');
      return;
    } catch { /* fall through */ }
    state.loading = false;
    $('listInfo').textContent = '查詢失敗';
    const retry = el('button', 'btn retry', '重試');
    retry.onclick = fetchRestaurants;
    $('listInfo').appendChild(retry);
  }

  async function fetchNominatim() {
    const { lat, lng } = state.pos;
    const dLat = state.filters.radius / 111320;
    const dLng = state.filters.radius / (111320 * Math.cos(lat * Math.PI / 180));
    const viewbox = `${lng - dLng},${lat + dLat},${lng + dLng},${lat - dLat}`;
    const seen = new Set();
    const items = [];
    for (let i = 0; i < NOMINATIM_QUERIES.length; i++) {
      $('listInfo').textContent = `備援資料源查詢中…(${i + 1}/${NOMINATIM_QUERIES.length})`;
      const url = `${NOMINATIM}?q=${encodeURIComponent(NOMINATIM_QUERIES[i])}&format=jsonv2` +
        `&bounded=1&viewbox=${viewbox}&limit=50&extratags=1&namedetails=1`;
      const data = await timedFetch(url, {}, 15000);
      for (const p of data) {
        const r = normalizeNominatim(p);
        if (r && !seen.has(r.id)) { seen.add(r.id); items.push(r); }
      }
      await new Promise(ok => setTimeout(ok, 1100)); // Nominatim usage policy: max 1 req/s
    }
    return items;
  }

  function normalizeNominatim(p) {
    const catId = TYPE_TO_CAT[p.type];
    if (!catId) return null;
    const tags = p.extratags || {};
    const nd = p.namedetails || {};
    const name = p.name || nd['name:zh'] || nd.name || tags['brand:zh'] || tags.brand;
    if (!name) return null;
    const lat = +p.lat, lng = +p.lon;
    if (!lat || !lng) return null;
    const cuisine = tags.cuisine ? tags.cuisine.split(';')[0].trim() : null;
    return {
      id: `${p.osm_type}/${p.osm_id}`,
      name, lat, lng,
      catId,
      catLabel: CATEGORY_BY_ID[catId].label,
      cuisine,
      cuisineLabel: cuisineLabel(tags.cuisine),
      openState: getOpenState(tags.opening_hours),
      addr: null,
      distance: haversineMeters(state.pos.lat, state.pos.lng, lat, lng),
      gmaps: `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,
    };
  }

  function normalizeAll(elements) {
    const out = [];
    for (const e of elements) {
      const tags = e.tags || {};
      const name = tags.name || tags['name:zh'] || tags['name:en'];
      if (!name) continue;
      const catId = categoryOf(tags);
      if (!catId) continue;
      const lat = e.lat ?? (e.center && e.center.lat);
      const lng = e.lon ?? (e.center && e.center.lon);
      if (lat === undefined || lng === undefined) continue;
      const cuisine = tags.cuisine ? tags.cuisine.split(';')[0].trim() : null;
      out.push({
        id: `${e.type}/${e.id}`,
        name, lat, lng,
        catId,
        catLabel: CATEGORY_BY_ID[catId].label,
        cuisine,
        cuisineLabel: cuisineLabel(tags.cuisine),
        openState: getOpenState(tags.opening_hours),
        addr: addressOf(tags),
        distance: haversineMeters(state.pos.lat, state.pos.lng, lat, lng),
        gmaps: `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,
      });
    }
    return out;
  }

  function addressOf(tags) {
    if (tags['addr:full']) return tags['addr:full'];
    const parts = [tags['addr:city'], tags['addr:district'], tags['addr:street'], tags['addr:housenumber']]
      .filter(Boolean);
    return parts.length ? parts.join('') : null;
  }

  function getOpenState(ohValue) {
    if (!ohValue || typeof opening_hours !== 'function') return 'unknown';
    try {
      const oh = new opening_hours(ohValue);
      return oh.getState() ? 'open' : 'closed';
    } catch {
      return 'unknown';
    }
  }

  /* ---------- 篩選 ---------- */
  function filtered() {
    const f = state.filters;
    return state.restaurants
      .filter(r => !state.blacklist.has(r.id))
      .filter(r => r.distance <= f.radius)
      .filter(r => f.cats.has(r.catId))
      .filter(r => f.cuisine === 'all' || r.cuisine === f.cuisine)
      .filter(r => !f.openNow || r.openState !== 'closed')
      .filter(r => !f.favOnly || state.favs.has(r.id))
      .sort((a, b) => a.distance - b.distance);
  }

  function saveFilters() {
    store.set(LS.FILTERS, {
      radius: state.filters.radius,
      cats: [...state.filters.cats],
      openNow: state.filters.openNow,
    });
  }

  function initFilters() {
    // 距離按鈕組
    const seg = $('radiusSeg');
    function syncRadius() {
      seg.querySelectorAll('button').forEach(b =>
        b.classList.toggle('active', +b.dataset.r === state.filters.radius));
    }
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      state.filters.radius = +b.dataset.r;
      syncRadius(); saveFilters();
      if (state.pos) { updateUserMarker(); fetchRestaurants(); }
    });
    syncRadius();

    // 類型 checkbox
    const box = $('catChecks');
    for (const def of CATEGORY_DEFS) {
      const lab = el('label', 'check');
      const cb = el('input');
      cb.type = 'checkbox';
      cb.checked = state.filters.cats.has(def.id);
      cb.onchange = () => {
        cb.checked ? state.filters.cats.add(def.id) : state.filters.cats.delete(def.id);
        saveFilters(); renderAll();
      };
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(' ' + def.label));
      box.appendChild(lab);
    }

    $('cuisineSel').onchange = (e) => { state.filters.cuisine = e.target.value; renderAll(); };
    $('openNowChk').checked = state.filters.openNow;
    $('openNowChk').onchange = (e) => { state.filters.openNow = e.target.checked; saveFilters(); renderAll(); };
    $('favOnlyChk').onchange = (e) => { state.filters.favOnly = e.target.checked; renderAll(); };

    $('filterToggle').onclick = () => $('filterPanel').classList.toggle('hidden');
  }

  function updateCuisineOptions() {
    const sel = $('cuisineSel');
    const prev = state.filters.cuisine;
    const seen = new Map();
    for (const r of state.restaurants) {
      if (r.cuisine && !seen.has(r.cuisine)) seen.set(r.cuisine, r.cuisineLabel);
    }
    sel.innerHTML = '';
    sel.appendChild(el('option', null, '全部')).value = 'all';
    for (const [raw, label] of [...seen.entries()].sort((a, b) => a[1].localeCompare(b[1], 'zh'))) {
      const o = el('option', null, label);
      o.value = raw;
      sel.appendChild(o);
    }
    sel.value = seen.has(prev) ? prev : 'all';
    state.filters.cuisine = sel.value;
  }

  /* ---------- 清單渲染 ---------- */
  const OPEN_TEXT = { open: '營業中', closed: '已打烊', unknown: '營業時間未提供' };

  function renderAll() {
    const items = filtered();
    renderMarkers(items);
    renderList(items);
    renderBlacklist();
  }

  function renderList(items) {
    const list = $('restaurantList');
    list.innerHTML = '';
    $('spinBtn').disabled = items.length === 0;
    if (!state.pos) { $('listInfo').textContent = ''; return; }
    if (state.loading) return;
    if (items.length === 0) {
      $('listInfo').textContent = state.restaurants.length
        ? '沒有符合條件的店,試試放寬篩選'
        : '附近查無餐廳,試試放大範圍';
      return;
    }
    $('listInfo').textContent = `共 ${items.length} 間` + (state.degraded ? '(備援資料)' : '');
    for (const r of items) {
      const card = el('li', 'card');
      card.dataset.id = r.id;

      const main = el('div', 'card-main');
      const title = el('div', 'card-title');
      title.appendChild(el('span', 'name', r.name));
      title.appendChild(el('span', 'badge', r.catLabel));
      main.appendChild(title);
      const sub = el('div', 'card-sub');
      sub.appendChild(el('span', null, [r.cuisineLabel, formatDist(r.distance)].filter(Boolean).join(' · ')));
      sub.appendChild(el('span', `open-${r.openState}`, ' ' + OPEN_TEXT[r.openState]));
      main.appendChild(sub);
      if (r.addr) main.appendChild(el('div', 'card-addr', r.addr));

      const actions = el('div', 'card-actions');
      const fav = el('button', 'icon-btn fav' + (state.favs.has(r.id) ? ' on' : ''), '♥');
      fav.title = '加入最愛';
      fav.onclick = (e) => { e.stopPropagation(); toggleFav(r.id); };
      const ban = el('button', 'icon-btn', '✕');
      ban.title = '加入黑名單';
      ban.onclick = (e) => { e.stopPropagation(); addBlacklist(r); };
      const go = el('a', 'icon-btn', '↗');
      go.href = r.gmaps; go.target = '_blank'; go.rel = 'noopener';
      go.title = '在 Google 地圖開啟';
      go.onclick = (e) => e.stopPropagation();
      actions.append(fav, ban, go);

      card.append(main, actions);
      card.onclick = () => {
        map.setView([r.lat, r.lng], 17);
        const m = markersById.get(r.id);
        if (m) m.openPopup();
      };
      list.appendChild(card);
    }
  }

  /* ---------- 最愛 / 黑名單 / 最近抽過 ---------- */
  function toggleFav(id) {
    state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
    store.set(LS.FAVS, [...state.favs]);
    renderAll();
  }

  function addBlacklist(r) {
    state.blacklist.set(r.id, r.name);
    persistBlacklist();
    toast(`已把「${r.name}」加入黑名單`);
    renderAll();
  }

  function removeBlacklist(id) {
    state.blacklist.delete(id);
    persistBlacklist();
    renderAll();
  }

  function persistBlacklist() {
    store.set(LS.BLACKLIST, [...state.blacklist.entries()].map(([id, name]) => ({ id, name })));
  }

  function renderBlacklist() {
    const box = $('blacklistBox');
    if (state.blacklist.size === 0) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    $('blacklistSummary').textContent = `已隱藏 ${state.blacklist.size} 間黑名單`;
    const ul = $('blacklistItems');
    ul.innerHTML = '';
    for (const [id, name] of state.blacklist) {
      const li = el('li', 'bl-item');
      li.appendChild(el('span', null, name));
      const btn = el('button', 'btn btn-ghost', '復原');
      btn.onclick = () => removeBlacklist(id);
      li.appendChild(btn);
      ul.appendChild(li);
    }
  }

  /* ---------- 拉霸 ---------- */
  function spinPool() {
    const base = filtered().filter(r => !state.recent.includes(r.id));
    if (base.length === 0 && state.recent.length > 0) {
      state.recent = [];
      store.set(LS.RECENT, state.recent);
      return filtered();
    }
    return base;
  }

  function spin() {
    const pool = spinPool();
    if (pool.length === 0) { toast('沒有可抽的店,試試放寬條件'); return; }
    const winner = pool[Math.floor(Math.random() * pool.length)];
    openOverlay();
    $('slotResult').classList.add('hidden');
    $('slotActions').classList.add('hidden');
    const nameEl = $('slotName');
    nameEl.classList.remove('done');

    let i = 0;
    const steps = 18 + Math.floor(Math.random() * 8);
    (function tick() {
      nameEl.textContent = pool[i % pool.length].name;
      i++;
      if (i < steps) {
        const t = i / steps;
        setTimeout(tick, 45 + 420 * t * t);
      } else {
        nameEl.textContent = winner.name;
        nameEl.classList.add('done');
        showWinner(winner);
      }
    })();
  }

  function showWinner(r) {
    state.lastWinner = r;
    state.recent.push(r.id);
    if (state.recent.length > RECENT_CAP) state.recent.shift();
    store.set(LS.RECENT, state.recent);

    const res = $('slotResult');
    res.innerHTML = '';
    res.appendChild(el('div', 'res-sub',
      `${r.catLabel}${r.cuisineLabel ? ' · ' + r.cuisineLabel : ''} · ${formatDist(r.distance)} · ${OPEN_TEXT[r.openState]}`));
    if (r.addr) res.appendChild(el('div', 'res-addr', r.addr));
    $('slotGmaps').href = r.gmaps;
    res.classList.remove('hidden');
    $('slotActions').classList.remove('hidden');
  }

  function openOverlay() { $('slotOverlay').classList.remove('hidden'); }
  function closeOverlay() { $('slotOverlay').classList.add('hidden'); }

  /* ---------- init ---------- */
  function init() {
    initMap();
    initFilters();
    renderBlacklist();
    $('locStatus').onclick = () => { state.manualPick = false; locate(); };
    $('spinBtn').onclick = spin;
    $('slotAgain').onclick = spin;
    $('slotClose').onclick = closeOverlay;
    $('slotDone').onclick = () => {
      closeOverlay();
      if (state.lastWinner) {
        map.setView([state.lastWinner.lat, state.lastWinner.lng], 17);
        const m = markersById.get(state.lastWinner.id);
        if (m) m.openPopup();
      }
    };
    locate();
  }

  init();
})();
</script>
